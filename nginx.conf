server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    absolute_redirect off;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 256;

    # Proxy API requests to the FastAPI backend
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        client_max_body_size 0;
    }

    # Proxy MinIO presigned URLs — the bucket name is the URL path prefix.
    # MINIO_PUBLIC_ENDPOINT must be set to the public hostname (no port),
    # so presigned URLs point here and nginx forwards them internally.
    location /mediaflow/ {
        proxy_pass http://minio:9000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # For Astro static output each page is a .html file; serve directly.
    # If no file found, fall back to the root index (handles /login, /dashboard etc.)
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }
}
